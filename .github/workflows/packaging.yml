name: Packaging

on:
  workflow_dispatch:
  push:
    branches: [main, production]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      # Avoid flatpak/flatpak-github-actions/flatpak-builder: it always passes
      # --install-deps-from=flathub, which *updates* the image SDK and dies on
      # Actions overlayfs with "Invalid cross-device link" / xvfb exit 139
      # (flatpak/flatpak-github-actions#267). Keep Flatpak's system install on
      # the workspace FS so ostree rename stays same-device, then build without
      # --install-deps-from.
      - name: Install Flatpak SDKs on the workspace
        run: |
          df -h
          # Drop the image's /var/lib/flatpak copy; we reinstall under the workspace.
          rm -rf /var/lib/flatpak/*
          export FLATPAK_SYSTEM_DIR="${GITHUB_WORKSPACE}/.flatpak-system"
          mkdir -p "$FLATPAK_SYSTEM_DIR"
          echo "FLATPAK_SYSTEM_DIR=$FLATPAK_SYSTEM_DIR" >> "$GITHUB_ENV"
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
          df -h
      # Export can fail when ostree's 3% free-space floor trips on crowded
      # Actions disks (only ~17MB short in recent runs).
      - name: Prepare ostree repo
        run: |
          mkdir -p repo
          ostree init --repo=repo --mode=archive-z2
          ostree --repo=repo config set core.min-free-space-percent 0
          ostree --repo=repo config set core.min-free-space-size 0MB
      - name: Build Flatpak
        run: |
          flatpak-builder \
            --force-clean \
            --disable-rofiles-fuse \
            --repo=repo \
            --default-branch=master \
            --arch=x86_64 \
            --state-dir=.flatpak-builder \
            flatpak_app \
            flatpak/sh.devnull.Client.yml
          flatpak build-bundle repo devnull.flatpak sh.devnull.Client master
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-x86_64
          path: devnull.flatpak
          retention-days: 14

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl \
            libgtk-4-dev libadwaita-1-dev \
            libglib2.0-dev libpango1.0-dev libgraphene-1.0-dev \
            libfuse2 openssh-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build AppImage
        run: scripts/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-x86_64
          path: dist/*.AppImage
          retention-days: 14

  macos:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK
        run: |
          brew install gtk4 libadwaita pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix libffi)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS binary
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ runner.arch }}
          path: dist/devnull-macos-*
          retention-days: 14
