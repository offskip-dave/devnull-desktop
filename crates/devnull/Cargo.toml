[package]
name = "devnull"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native GTK client for /dev/null"

[[bin]]
name = "devnull"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
devnull-api.workspace = true
devnull-auth.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
relm4 = { version = "0.11", features = ["libadwaita", "macros", "gnome_46"] }
pulldown-cmark = { version = "0.13", default-features = false }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "plist-load", "regex-fancy", "dump-load"] }
tokio.workspace = true
uuid.workspace = true
url.workspace = true
