[workspace]
resolver = "2"
members = ["crates/devnull-api", "crates/devnull-auth", "crates/devnull"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/dev-null-sh/dev-null-linux"
authors = ["/dev/null community"]

[workspace.dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
hex = "0.4"
hostname = "0.4"
oo7 = "0.5"
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

devnull-api = { path = "crates/devnull-api" }
devnull-auth = { path = "crates/devnull-auth" }
